spring.application.name=placement-scheduler

# Server Configuration
server.port=${SERVER_PORT:8080}

# Datasource Credentials & Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_scheduler}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:6301}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}

# Exception Handling Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}