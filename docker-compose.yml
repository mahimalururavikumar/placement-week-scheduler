name: placement-week-scheduler

services:
  # ==========================================
  # MySQL Database Service (MySQL 8.0)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: placement-scheduler-db
    restart: always
    environment:
      MYSQL_DATABASE: placement_scheduler
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-6301}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-6301}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - placement-network

  # ==========================================
  # Spring Boot Backend Service (Java 21)
  # ==========================================
  backend:
    build:
      context: ./placement-scheduler
      dockerfile: Dockerfile
    container_name: placement-scheduler-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/placement_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-6301}
      DDL_AUTO: update
      SHOW_SQL: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://localhost,http://localhost:80,http://frontend"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - placement-network

  # ==========================================
  # Angular Frontend Service (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./placement-scheduler-ui
      dockerfile: Dockerfile
    container_name: placement-scheduler-frontend
    restart: always
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend
    networks:
      - placement-network

volumes:
  mysql_data:
    driver: local

networks:
  placement-network:
    driver: bridge
